<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SPARC'd</title>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <script>
      // The theme the Uploader and Tagger share, applied before paint.
      try {
        if (localStorage.getItem('sparcd-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      @font-face {
        font-family: 'Newsreader';
        font-weight: 600;
        font-display: swap;
        src: url(fonts/newsreader-2.ttf) format('truetype');
      }
      :root {
        --paper: #f4ecd8;
        --paperHover: #efe6cc;
        --panel: #fbf7eb;
        --ink: #1c1a14;
        --inkSoft: #4a463b;
        --rule: #8c8166;
        --accent: #0b3358;
      }
      .dark {
        --paper: #211c15;
        --paperHover: #2a241b;
        --panel: #2a241b;
        --ink: #f0e8d6;
        --inkSoft: #c9bfa6;
        --rule: #6b6047;
        --accent: #7da7d9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Inter Tight', Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--rule);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px;
        font: 600 24px/1 Newsreader, Georgia, serif;
        white-space: nowrap;
      }
      .brand img {
        height: 32px;
        width: auto;
      }
      #theme {
        margin-left: auto;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        background: none;
        border: 1px solid var(--rule);
        color: var(--inkSoft);
        font-size: 20px;
        cursor: pointer;
      }
      #theme:hover {
        color: var(--ink);
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 64px 24px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }
      @media (min-width: 640px) {
        main {
          grid-template-columns: 1fr 1fr;
        }
      }
      main a {
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--ink);
        font: 600 34px Newsreader, Georgia, serif;
        text-decoration: none;
        transition: transform 150ms ease-out;
      }
      main a:active {
        transform: scale(0.98);
      }
      .upload {
        background: var(--ink);
        color: var(--paper);
      }
      .upload:hover {
        opacity: 0.9;
      }
      .tag {
        background: var(--panel);
        color: var(--ink);
      }
      .tag:hover {
        background: var(--paperHover);
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        main a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand"><img src="sparcd.png" alt="" />SPARC'd</span>
      <button id="theme" type="button"><span aria-hidden="true"></span></button>
    </header>
    <main>
      <a class="upload" href="/upload/">Upload photos</a>
      <a class="tag" href="/tag/">Tag photos</a>
    </main>
    <script>
      var button = document.getElementById('theme');
      function show() {
        var dark = document.documentElement.classList.contains('dark');
        var label = dark ? 'Switch to light' : 'Switch to dark';
        button.firstChild.textContent = dark ? '☀' : '☾';
        button.setAttribute('aria-label', label);
        button.title = label;
      }
      button.onclick = function () {
        var dark = document.documentElement.classList.toggle('dark');
        try {
          localStorage.setItem('sparcd-theme', dark ? 'dark' : 'light');
        } catch (e) {}
        show();
      };
      show();
    </script>
  </body>
</html>
